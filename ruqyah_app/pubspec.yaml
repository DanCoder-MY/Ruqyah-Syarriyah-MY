name: ruqyah_app
description: "Ruqyah Syar'iyyah — Pro Edition. Authentic Qur'an & Sunnah based self-healing and spiritual protection."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management / DI
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Routing
  go_router: ^14.2.7

  # Audio
  just_audio: ^0.9.40
  just_audio_background: ^0.0.1-beta.13
  audio_service: ^0.18.15
  audio_session: ^0.1.21

  # Local storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.3.2
  path_provider: ^2.1.4

  # Networking (remote audio packs)
  dio: ^5.7.0

  # Utilities
  intl: ^0.19.0
  collection: ^1.18.0
  equatable: ^2.0.5

  # UI
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1

  # Monetization (premium)
  # revenuecat integration is optional; wire keys before enabling.
  purchases_flutter: ^8.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.12
  riverpod_generator: ^2.4.3
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/content/
    - assets/images/
    - assets/audio/

  fonts:
    - family: AmiriQuran
      fonts:
        - asset: assets/fonts/AmiriQuran-Regular.ttf
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri-Regular.ttf
        - asset: assets/fonts/Amiri-Bold.ttf
          weight: 700
